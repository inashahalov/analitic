<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Сравнение архитектур Кимбалла и Инмона</title>
<style>
  text { font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  .t { font-size: 14px; fill: #2c2c2a; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .box-gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .box-gray text { fill: #2C2C2A; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .box-teal text { fill: #04342C; }
  .box-purple { fill: #EEEDFE; stroke: #534AB7; }
  .box-purple text { fill: #26215C; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="ts" x="185" y="18" text-anchor="middle" fill="#5F5E5A">Кимбалл — bottom-up</text>
<text class="ts" x="485" y="18" text-anchor="middle" fill="#5F5E5A">Инмон — top-down</text>

<g class="box-gray"><rect x="90" y="34" width="190" height="44" rx="8" stroke-width="0.5"/><text class="th" x="185" y="60" text-anchor="middle">Источники</text></g>
<g class="box-gray"><rect x="390" y="34" width="190" height="44" rx="8" stroke-width="0.5"/><text class="th" x="485" y="60" text-anchor="middle">Источники</text></g>

<line x1="185" y1="78" x2="185" y2="98" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="78" x2="485" y2="98" class="arr" marker-end="url(#arrow)"/>

<g class="box-gray"><rect x="90" y="98" width="190" height="44" rx="8" stroke-width="0.5"/><text class="th" x="185" y="124" text-anchor="middle">Staging area</text></g>
<g class="box-teal"><rect x="390" y="98" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485" y="122" text-anchor="middle">Центральное ХД</text><text class="ts" x="485" y="142" text-anchor="middle">3НФ</text></g>

<line x1="185" y1="142" x2="185" y2="174" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="154" x2="485" y2="174" class="arr" marker-end="url(#arrow)"/>

<g class="box-purple"><rect x="90" y="174" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="198" text-anchor="middle">Витрины</text><text class="ts" x="185" y="218" text-anchor="middle">Схема звезда</text></g>
<g class="box-purple"><rect x="390" y="174" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485" y="198" text-anchor="middle">Витрины</text><text class="ts" x="485" y="218" text-anchor="middle">На основе EDW</text></g>

<line x1="185" y1="230" x2="185" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="230" x2="485" y2="250" class="arr" marker-end="url(#arrow)"/>

<g class="box-gray"><rect x="90" y="250" width="190" height="44" rx="8" stroke-width="0.5"/><text class="th" x="185" y="276" text-anchor="middle">BI / пользователи</text></g>
<g class="box-gray"><rect x="390" y="250" width="190" height="44" rx="8" stroke-width="0.5"/><text class="th" x="485" y="276" text-anchor="middle">BI / пользователи</text></g>
</svg>
