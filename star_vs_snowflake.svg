<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Звезда против снежинки</title>
<style>
  text { font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .box-teal text { fill: #04342C; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; }
  .box-coral text { fill: #4A1B0C; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="ts" x="40" y="20" fill="#5F5E5A">Звезда: одно денормализованное измерение</text>
<g class="box-teal"><rect x="60" y="34" width="220" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="60" text-anchor="middle">Товар (все атрибуты)</text></g>
<line x1="280" y1="56" x2="340" y2="56" class="arr" marker-end="url(#arrow2)"/>
<g class="box-coral"><rect x="340" y="34" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="430" y="60" text-anchor="middle">Факт продаж</text></g>

<text class="ts" x="40" y="120" fill="#5F5E5A">Снежинка: измерение разбито на подтаблицы</text>
<g class="box-teal"><rect x="60" y="134" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="160" text-anchor="middle">Категория</text></g>
<line x1="200" y1="156" x2="250" y2="156" class="arr" marker-end="url(#arrow2)"/>
<g class="box-teal"><rect x="250" y="134" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="320" y="160" text-anchor="middle">Товар</text></g>
<line x1="390" y1="156" x2="440" y2="156" class="arr" marker-end="url(#arrow2)"/>
<g class="box-coral"><rect x="440" y="134" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="530" y="160" text-anchor="middle">Факт продаж</text></g>
</svg>
